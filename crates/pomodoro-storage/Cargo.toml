[package]
name = "pomodoro-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "SQLite persistence and automatic backups for Pomodoro"

[dependencies]
rusqlite = { version = "0.43.0", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
