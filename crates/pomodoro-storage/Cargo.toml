[package]
name = "pomodoro-storage"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Append-only JSON persistence and automatic backups for Pomodoro"

[dependencies]
# SQLite is read-only and used solely to migrate data created by v0.1.x.
rusqlite = { version = "0.43.0", features = ["bundled"] }
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
