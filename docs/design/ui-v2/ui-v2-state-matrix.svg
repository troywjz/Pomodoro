<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
 <title id="title">Pomodoro UI v2 full state review</title>
 <desc id="desc">Candidate review sheet with Light and Dark expanded timer, collapsed timer, settings, confirmation, error and recovery states. All sample windows are 192 logical pixels wide. Physical width and DPI matrix is documented alongside the source.</desc>
 <defs><style>text{font-family:Segoe UI,Arial,sans-serif}.h{font-size:34px;font-weight:700}.sub{font-size:18px}.head{font-size:22px;font-weight:700}.body{font-size:18px}.tiny{font-size:15px}.timer{font-size:31px;font-weight:700}.btn{font-size:17px;font-weight:700}</style></defs>
 <rect width="1800" height="1320" fill="#eef1f5"/>
 <text class="h" x="40" y="52" fill="#172033">Pomodoro · UI v2 state matrix</text><text class="sub" x="40" y="82" fill="#596579">CANDIDATE · pending product/design approval · 192 logical px reference window · all states are editable vector elements</text>
 <g transform="translate(40 120)"><text class="head" x="0" y="0" fill="#172033">LIGHT · system match / initial fallback</text>
  <g transform="translate(0 20)"><rect width="350" height="290" rx="18" fill="#fff" stroke="#cbd3df"/><text class="body" x="18" y="32" fill="#172033">Expanded · running</text><text class="tiny" x="18" y="55" fill="#667085">idle with target → running · 192×300 dip</text><text class="body" x="28" y="100" fill="#182236">专注 · 第 2 轮</text><circle cx="65" cy="155" r="24" fill="none" stroke="#e5eaf2" stroke-width="6"/><circle cx="65" cy="155" r="24" fill="none" stroke="#4263eb" stroke-width="6" stroke-dasharray="146.6 4" transform="rotate(-90 65 155)"/><text class="timer" x="101" y="165" fill="#182236">24:18</text><text class="tiny" x="28" y="207" fill="#596579">remaining / target = 97.2%</text><rect x="28" y="224" width="294" height="44" rx="10" fill="#4263eb"/><text class="btn" x="175" y="251" text-anchor="middle" fill="white">暂停</text></g>
  <g transform="translate(370 20)"><rect width="350" height="290" rx="18" fill="#fff" stroke="#cbd3df"/><text class="body" x="18" y="32" fill="#172033">Expanded · idle without target</text><text class="tiny" x="18" y="55" fill="#667085">empty track; no implied countdown</text><text class="body" x="28" y="100" fill="#182236">选择阶段</text><circle cx="65" cy="155" r="24" fill="none" stroke="#e5eaf2" stroke-width="6"/><text class="timer" x="101" y="165" fill="#98a2b3">--:--</text><rect x="28" y="224" width="294" height="44" rx="10" fill="#aab4c4"/><text class="btn" x="175" y="251" text-anchor="middle" fill="#fff">选择阶段</text></g>
  <g transform="translate(740 20)"><rect width="350" height="290" rx="18" fill="#fff" stroke="#cbd3df"/><text class="body" x="18" y="32" fill="#172033">Expanded · paused</text><text class="tiny" x="18" y="55" fill="#667085">ring and exact digits freeze together</text><text class="body" x="28" y="100" fill="#182236">专注 · 已暂停</text><circle cx="65" cy="155" r="24" fill="none" stroke="#e5eaf2" stroke-width="6"/><circle cx="65" cy="155" r="24" fill="none" stroke="#4263eb" stroke-width="6" stroke-dasharray="146.6 4" transform="rotate(-90 65 155)"/><text class="timer" x="101" y="165" fill="#182236">24:18</text><rect x="28" y="224" width="294" height="44" rx="10" fill="#4263eb"/><text class="btn" x="175" y="251" text-anchor="middle" fill="#fff">继续</text></g>
  <g transform="translate(1110 20)"><rect width="350" height="290" rx="18" fill="#fff" stroke="#cbd3df"/><text class="body" x="18" y="32" fill="#172033">Collapsed · completed</text><text class="tiny" x="18" y="55" fill="#667085">same 192 dip width · shorter height</text><circle cx="52" cy="130" r="18" fill="none" stroke="#e5eaf2" stroke-width="5"/><text class="timer" x="82" y="140" fill="#182236">00:00</text><rect x="230" y="99" width="100" height="64" rx="10" fill="#4263eb"/><text class="btn" x="280" y="137" text-anchor="middle" fill="#fff">下一阶段</text><text class="tiny" x="18" y="205" fill="#596579">✓ 专注已完成 · progress = 0</text><text class="tiny" x="18" y="235" fill="#4263eb">设置</text><text class="tiny" x="295" y="235" fill="#4263eb">展开</text></g>
 </g>
 <g transform="translate(40 470)"><text class="head" x="0" y="0" fill="#172033">DARK · follows current system theme</text>
  <g transform="translate(0 20)"><rect width="350" height="300" rx="18" fill="#171b24" stroke="#394152"/><text class="body" x="18" y="32" fill="#f3f5f8">Settings</text><text class="tiny" x="18" y="58" fill="#b4bdcc">system theme: Dark · runtime change updates tokens</text><text class="body" x="24" y="105" fill="#f3f5f8">阶段时长</text><rect x="24" y="120" width="302" height="44" rx="8" fill="#252c39" stroke="#596477"/><text class="body" x="40" y="149" fill="#f3f5f8">专注　25 分钟</text><text class="body" x="24" y="203" fill="#f3f5f8">主题</text><rect x="24" y="218" width="302" height="42" rx="8" fill="#252c39" stroke="#596477"/><text class="body" x="40" y="246" fill="#dce3ff">跟随系统　● 深色</text></g>
  <g transform="translate(370 20)"><rect width="350" height="300" rx="18" fill="#171b24" stroke="#394152"/><text class="body" x="18" y="32" fill="#f3f5f8">Confirmation</text><text class="tiny" x="18" y="58" fill="#b4bdcc">clear history · active focus exists</text><text class="body" x="24" y="108" fill="#f3f5f8">将结束当前专注并清除历史</text><text class="tiny" x="24" y="138" fill="#b4bdcc">配置、活动快照与备份会保留。</text><rect x="20" y="210" width="145" height="48" rx="10" fill="#252c39" stroke="#596477"/><text class="btn" x="92" y="239" text-anchor="middle" fill="#f3f5f8">取消</text><rect x="180" y="210" width="150" height="48" rx="10" fill="#91a7ff"/><text class="btn" x="255" y="239" text-anchor="middle" fill="#151a25">继续</text></g>
  <g transform="translate(740 20)"><rect width="350" height="300" rx="18" fill="#171b24" stroke="#394152"/><text class="body" x="18" y="32" fill="#f3f5f8">Error · backup failed</text><rect x="20" y="70" width="310" height="115" rx="12" fill="#38242a" stroke="#a84e5b"/><text class="body" x="38" y="108" fill="#ffb4bd">清理已取消</text><text class="tiny" x="38" y="137" fill="#f4d7db">备份未通过验证，历史数据保留。</text><rect x="20" y="215" width="310" height="46" rx="10" fill="#91a7ff"/><text class="btn" x="175" y="243" text-anchor="middle" fill="#151a25">重试备份</text></g>
  <g transform="translate(1110 20)"><rect width="350" height="300" rx="18" fill="#171b24" stroke="#394152"/><text class="body" x="18" y="32" fill="#f3f5f8">Recovery · paused snapshot</text><text class="tiny" x="22" y="67" fill="#b4bdcc">最近保存：09:41 · 专注 · 24:18</text><circle cx="54" cy="125" r="20" fill="none" stroke="#343b49" stroke-width="5"/><circle cx="54" cy="125" r="20" fill="none" stroke="#91a7ff" stroke-width="5" stroke-dasharray="122 4" transform="rotate(-90 54 125)"/><text class="timer" x="84" y="135" fill="#f3f5f8">24:18</text><text class="tiny" x="22" y="177" fill="#b4bdcc">选择前冻结，不扣离线时间。</text><rect x="20" y="205" width="96" height="46" rx="9" fill="#91a7ff"/><text class="btn" x="68" y="233" text-anchor="middle" fill="#151a25">继续</text><rect x="126" y="205" width="116" height="46" rx="9" fill="#252c39" stroke="#596477"/><text class="btn" x="184" y="233" text-anchor="middle" fill="#f3f5f8">保持暂停</text><text class="tiny" x="258" y="233" fill="#ffb4bd">放弃本段</text></g>
 </g>
 <g transform="translate(40 850)"><text class="head" x="0" y="0" fill="#172033">Interaction &amp; layout rules · candidate</text>
  <rect x="0" y="20" width="710" height="390" rx="18" fill="#fff" stroke="#cbd3df"/><text class="body" x="22" y="58" fill="#172033">Button states and semantics</text><g class="tiny" fill="#596579"><text x="26" y="98">Default: full click target; centered label.</text><text x="26" y="130">Hover/Pressed: surface changes; label stays centered.</text><text x="26" y="162">Focus: visible 2 px ring; Tab follows visual order.</text><text x="26" y="194">Enter / Space activates the focused button once.</text><text x="26" y="226">Disabled: muted style and no activation.</text><text x="26" y="258">Settings and Expand/Collapse stay independently reachable.</text><text x="26" y="302">Screen reader: “剩余时间，专注，24 分 18 秒，运行中”.</text><text x="26" y="334">Arc is decorative; text gives exact time and state.</text></g><rect x="460" y="70" width="210" height="44" rx="8" fill="#4263eb"/><text class="tiny" x="565" y="97" text-anchor="middle" fill="#fff">Default</text><rect x="460" y="124" width="210" height="44" rx="8" fill="#5474f0"/><text class="tiny" x="565" y="151" text-anchor="middle" fill="#fff">Hover</text><rect x="460" y="178" width="210" height="44" rx="8" fill="#304fc7"/><text class="tiny" x="565" y="205" text-anchor="middle" fill="#fff">Pressed</text><rect x="460" y="232" width="210" height="44" rx="8" fill="#c7cfda"/><text class="tiny" x="565" y="259" text-anchor="middle" fill="#667085">Disabled</text><rect x="455" y="298" width="220" height="56" rx="12" fill="#4263eb" stroke="#172033" stroke-width="2"/><rect x="450" y="293" width="230" height="66" rx="15" fill="none" stroke="#f2a900" stroke-width="3"/><text class="btn" x="565" y="330" text-anchor="middle" fill="#fff">Focus</text>
  <rect x="740" y="20" width="720" height="390" rx="18" fill="#fff" stroke="#cbd3df"/><text class="body" x="762" y="58" fill="#172033">Physical width / logical width matrix</text><g class="tiny" fill="#344054"><text x="765" y="100">1366×768 @100%</text><text x="1025" y="100">Wpx 137</text><text x="1215" y="100">Wdip 137</text><text x="765" y="142">1920×1080 @100%</text><text x="1025" y="142">Wpx 192</text><text x="1215" y="142">Wdip 192</text><text x="765" y="184">2560×1440 @125%</text><text x="1025" y="184">Wpx 256</text><text x="1215" y="184">Wdip 204.8</text><text x="765" y="226">3840×2160 @150%</text><text x="1025" y="226">Wpx 384</text><text x="1215" y="226">Wdip 256</text><text x="765" y="268">Mixed DPI: 1920@100% ↔ 2560@150%</text><text x="765" y="302">Wpx: 192 ↔ 256 · Wdip: 192 ↔ 170.67</text><text x="765" y="342">Wpx = floor(display physical width / 10 + 0.5)</text><text x="765" y="376">Expanded/collapsed share W; height/content change only.</text></g>
 </g>
 <text class="tiny" x="40" y="1305" fill="#667085">Candidate specification only · browser render reviewed locally · Figma native page synchronization pending current channel quota</text>
</svg>
